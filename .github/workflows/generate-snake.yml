name: Generate RAYSS868 Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate streak stats (dark)
        uses: DenverCoder1/github-readme-streak-stats@f69662e10794e8757b12d3303a113a30b01c9bc9 # main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=00000000&ring=22D3EE&fire=22D3EE&currStreakLabel=67E8F9&currStreakNum=E6FCFF&sideNums=E6FCFF&sideLabels=22D3EE&dates=94A3B8&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats (light)
        uses: DenverCoder1/github-readme-streak-stats@f69662e10794e8757b12d3303a113a30b01c9bc9 # main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=00000000&ring=0891B2&fire=0891B2&currStreakLabel=0891B2&currStreakNum=0F172A&sideNums=0F172A&sideLabels=0891B2&dates=475569&disable_animations=true
          path: dist/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0891B2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#020617,#083344,#155E75,#0E7490,#22D3EE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate animated hero assets
        run: |
          python scripts/gen_hero.py
          mkdir -p dist
          cp assets/hero-dark.svg assets/hero-light.svg assets/wordmark-dark.svg assets/wordmark-light.svg assets/ticker.svg dist/

      - name: Generate terminal gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet github-readme-terminal==0.0.3
          mkdir -p dist ~/.config/gifos
          cp config/*.toml ~/.config/gifos/
          python scripts/gen_terminal.py
          mv terminal.gif dist/terminal.gif

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
