name: Generate Profile Terminal

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/profile-assets.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate terminal GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet github-readme-terminal==0.0.3
          mkdir -p dist ~/.config/gifos
          cp config/*.toml ~/.config/gifos/
          python scripts/gen_terminal.py
          mv terminal.gif dist/terminal.gif

      - name: Publish generated asset
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile terminal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

